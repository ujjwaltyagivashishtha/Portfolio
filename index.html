    <!-- Pre-paint theme resolution: applies URL ?theme= or the stored preference before React mounts, preventing a wrong-theme flash -->
    <script>
      (function () {
        try {
          var theme = new URLSearchParams(window.location.search).get('theme')
            || localStorage.getItem('theme')
            || 'dark';
          document.documentElement.classList.remove('dark', 'light');
          document.documentElement.classList.add(theme === 'light' ? 'light' : 'dark');
        } catch (e) { /* storage unavailable — keep server-side default */ }
      })();
    </script>
